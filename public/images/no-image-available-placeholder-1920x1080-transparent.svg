<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   version="1.1"
   viewBox="0 0 1920 1080"
   width="1920"
   height="1080">

  <!-- Transparent background (no rect) -->

  <!-- Icon centered at (960, 460) -->
  <g transform="translate(960,460)">

    <!-- Back card (rotated -16 degrees, solid dark gray) -->
    <g transform="rotate(-16)">
      <rect x="-130" y="-155" width="260" height="300" rx="22"
            fill="#9f9f9f"/>
    </g>

    <!-- Front card (rotated +16 degrees, with landscape illustration) -->
    <g transform="rotate(16)">
      <defs>
        <clipPath id="cardClip">
          <rect x="-130" y="-155" width="260" height="300" rx="14"/>
        </clipPath>
        <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c2c2c2"/>
          <stop offset="1" stop-color="#9f9f9f"/>
        </linearGradient>
      </defs>

      <!-- Card body with gradient -->
      <rect x="-130" y="-155" width="260" height="300" rx="14"
            fill="url(#cardGrad)" stroke="#ffffff" stroke-width="12"/>

      <g clip-path="url(#cardClip)">
        <!-- White sky top half -->
        <rect x="-130" y="-155" width="260" height="155" fill="#ffffff"/>

        <!-- Sun circle -->
        <circle cx="-72" cy="-95" r="32" fill="#cccccc"/>

        <!-- Foreground ground base -->
        <rect x="-130" y="0" width="260" height="145" fill="#cccccc"/>

        <!-- Mountain/hill silhouette path -->
        <polygon points="-130,0 -85,-75 -30,-15 25,-90 75,-40 120,-80 200,10 200,145 -130,145"
                 fill="#cccccc"/>
        <!-- Horizon line overlay for contrast -->
        <polyline
          points="-130,0 -85,-75 -30,-15 25,-90 75,-40 120,-80 200,10"
          fill="none" stroke="#ffffff" stroke-width="9"
          stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Mid-ground hills (slightly lighter) -->
        <polygon points="-50,-5 20,-55 95,-10 160,-50 200,0 200,60 -130,60 -130,0"
                 fill="#b3b3b3"/>
        <polyline
          points="-50,-5 20,-55 95,-10 160,-50 200,0"
          fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linejoin="round" stroke-linecap="round"/>
      </g>
    </g>

  </g>

  <!-- "No Image Available" text centered -->
  <text
     x="960"
     y="930"
     font-family="sans-serif"
     font-weight="bold"
     font-size="64"
     fill="#767676"
     text-anchor="middle">No Image Available</text>

</svg>
